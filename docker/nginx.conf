server {
    listen __PORT__ default_server;
    root /var/www/html/public;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    # Laravel: the API and the health check
    location ~ ^/(api|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        # Gemini Pro with tools can take a while; Cloud Run's own timeout is 300 s
        fastcgi_read_timeout 120s;
    }

    # Any other .php file is never executed
    location ~ \.php$ {
        return 404;
    }

    # Hashed build files can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app's HTML must be rechecked on every visit, or browsers keep showing the previous release
    # (its hashed /assets/ files are what get cached).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Everything else is the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
